<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朋友型 Agent · 对话</title>
<style>
  :root{
    --bg:#0a0b0d; --panel:#101216; --panel-2:#161a20;
    --ink:#e8e5de; --dim:#8f8c84; --faint:#63615c;
    --line:#1e2228; --line-2:#2a2f37;
    --accent:#e2a53f; --ok:#63b07d; --bad:#d2604f;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --r:4px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.6;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border:2px solid var(--bg)}
  a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line-2)}
  a:hover{color:var(--accent);border-bottom-color:var(--accent)}
  button{cursor:pointer;font:inherit;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:var(--r);padding:7px 12px}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#1b1508;font-weight:650}
  button.primary:hover{filter:brightness(1.08);color:#1b1508}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:var(--r);padding:7px 11px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}

  header{flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--panel);
    padding:11px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header .grow{flex:1}
  header select{color:var(--dim)}
  header input{width:130px}
  .st{color:var(--faint);font-size:11.5px;display:flex;align-items:center;gap:7px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
  .dot.off{background:var(--bad)}
  .dot.busy{background:var(--accent);animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:.25}}

  .stream{flex:1 1 auto;overflow-y:auto;padding:26px 20px 10px}
  .inner{max-width:760px;margin:0 auto}
  .m{margin-bottom:20px}
  .m .meta{color:var(--faint);font-size:10.5px;font-family:var(--mono);margin-top:5px;letter-spacing:.04em}
  .m.user{display:flex;flex-direction:column;align-items:flex-end}
  .m.user .bub{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r);
    padding:10px 14px;max-width:78%;white-space:pre-wrap;word-break:break-word}
  .m.as .txt{white-space:pre-wrap;word-break:break-word;font-size:14px;max-width:88%}
  .m.as .who{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:650;margin-bottom:6px}

  details.tool{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:var(--r);
    background:var(--panel);margin:0 0 12px;max-width:88%}
  details.tool.bad{border-left-color:var(--bad)}
  details.tool summary{cursor:pointer;padding:8px 13px;font-size:12px;color:var(--dim);
    list-style:none;display:flex;gap:10px;align-items:center}
  details.tool summary::-webkit-details-marker{display:none}
  details.tool summary::before{content:"▸";color:var(--accent);font-size:10px}
  details.tool[open] summary::before{content:"▾"}
  details.tool summary .fn{font-family:var(--mono);color:var(--ink);font-size:12px}
  details.tool summary .ms{color:var(--faint);font-family:var(--mono);font-size:11px;margin-left:auto}
  details.tool .body{padding:0 13px 12px}
  details.tool .lb{color:var(--faint);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    margin:10px 0 5px;font-weight:650}
  details.tool pre{margin:0;background:#0c0e11;border:1px solid var(--line);border-radius:3px;
    padding:9px 11px;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--dim);
    white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto}
  details.tool.bad pre{color:#c98b82}

  .notice{color:var(--faint);font-size:11.8px;border-left:2px solid var(--line-2);
    padding:6px 12px;margin:0 0 12px;max-width:88%;white-space:pre-wrap}
  .notice.err{border-left-color:var(--bad);color:var(--bad)}
  .m.live .txt{color:var(--ink)}
  .m.live .who{color:var(--accent);opacity:.75}
  .caret{display:inline-block;width:7px;height:14px;background:var(--accent);margin-left:3px;
    vertical-align:-2px;animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
  .empty{color:var(--faint);text-align:center;padding:60px 20px;font-size:13px}

  .composer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);padding:14px 20px 18px}
  .composer .wrap{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;min-height:44px;max-height:180px;line-height:1.55}
  .composer button{height:44px;padding:0 20px}
  .composer .hint{max-width:760px;margin:8px auto 0;color:var(--faint);font-size:11px}

  #gate{display:none;padding:10px 20px;background:#150f0e;border-bottom:1px solid var(--bad);color:var(--bad);font-size:12.5px}
  #gate input{margin:0 8px}
  #mempick{max-width:760px;margin:0 auto;color:var(--faint);font-size:11.5px}
  #mempick summary{cursor:pointer}
  #mempick .tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
  #mempick .tag{border:1px solid var(--line-2);border-radius:2px;padding:2px 7px;
    color:var(--dim);font-size:11px;background:var(--panel-2)}
</style>
</head>
<body>

<header>
  <span class="st"><span id="dot" class="dot off"></span><span id="stat">连接中…</span></span>
  <span class="grow"></span>
  <select id="ch">
    <option value="qq">qq</option><option value="telegram">telegram</option>
    <option value="panel">panel</option><option value="cli">cli</option>
  </select>
  <input id="uid" placeholder="externalId">
  <button id="apply">切换身份</button>
  <span class="st" id="pid"></span>
  <a href="/">控制台 →</a>
</header>

<div id="gate">
  需要访问令牌 <input id="gate-input" placeholder="粘贴 token"><button id="gate-btn">确定</button>
</div>

<div class="stream" id="stream"><div class="inner" id="inner"></div></div>

<div class="composer">
  <div id="mempick" hidden></div>
  <div class="wrap">
    <textarea id="text" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="primary" id="send">发送</button>
  </div>
  <div class="hint">这是同一个「小满」—— 换 channel + 身份就是另一个人；同一人的 QQ/TG 会归并到同一个 personId。</div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const qs = new URLSearchParams(location.search);
if (qs.get('token')) { localStorage.setItem('fa_token', qs.get('token')); history.replaceState(null, '', location.pathname); }
if (qs.get('channel')) localStorage.setItem('fa_ch', qs.get('channel'));
if (qs.get('externalId')) localStorage.setItem('fa_uid', qs.get('externalId'));
function getToken() { return localStorage.getItem('fa_token') || ''; }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hhmmss = (t) => new Date(t).toLocaleTimeString('zh-CN', { hour12: false });

$('#ch').value = localStorage.getItem('fa_ch') || 'qq';
$('#uid').value = localStorage.getItem('fa_uid') || '10001';

let lastKey = '';
let inflight = false;

async function api(path, opts) {
  const o = opts || {};
  o.headers = Object.assign({}, o.headers, { 'x-panel-token': getToken() });
  const res = await fetch(path, o);
  if (res.status === 401) { $('#gate').style.display = 'block'; return { error: 'unauthorized' }; }
  const t = await res.text();
  try { return JSON.parse(t); } catch { return { error: t.slice(0, 300) }; }
}

function pretty(s) {
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; }
}

function renderEvents(events) {
  if (!events.length) {
    return '<div class="empty">还没有对话。发一句试试 —— 工具调用、压缩、插话都会在这里显示。</div>';
  }
  return events.map((e) => {
    if (e.kind === 'user') {
      return '<div class="m user"><div class="bub">' + esc(e.text) + '</div>'
        + '<div class="meta">' + hhmmss(e.at) + ' · ' + esc(e.channel) + '</div></div>';
    }
    if (e.kind === 'assistant') {
      return '<div class="m as"><div class="who">小满</div><div class="txt">' + esc(e.text) + '</div>'
        + '<div class="meta">' + hhmmss(e.at) + '</div></div>';
    }
    if (e.kind === 'tool') {
      return '<details class="tool' + (e.error ? ' bad' : '') + '"><summary>'
        + '<span class="fn">' + esc(e.name) + '</span>'
        + '<span class="ms">' + e.ms + 'ms ' + hhmmss(e.at) + '</span></summary>'
        + '<div class="body"><div class="lb">参数</div><pre>' + esc(pretty(e.args)) + '</pre>'
        + '<div class="lb">返回</div><pre>' + esc(e.result) + '</pre></div></details>';
    }
    return '<div class="notice' + (e.kind === 'error' ? ' err' : '') + '">' + esc(e.text) + '</div>';
  }).join('');
}

function renderMemory(memory) {
  const el = $('#mempick');
  if (!memory.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = '<details><summary>这个人的记忆（' + memory.length + ' 条）</summary>'
    + '<div class="tags">' + memory.map((m) => '<span class="tag">' + esc(m.text.slice(0, 60)) + '</span>').join('') + '</div></details>';
}

async function tick() {
  const channel = $('#ch').value;
  const externalId = $('#uid').value.trim() || '10001';
  const d = await api('/api/chat?channel=' + encodeURIComponent(channel) + '&externalId=' + encodeURIComponent(externalId));
  if (d.error) { $('#dot').className = 'dot off'; $('#stat').textContent = '未授权'; return; }

  $('#pid').textContent = d.person ? d.person.id : '（还没有对话）';
  $('#dot').className = 'dot' + (d.running ? ' busy' : '');
  $('#stat').textContent = d.running ? '正在处理…' : '在线';

  const events = d.events || [];
  const atBottom = $('#stream').scrollHeight - $('#stream').scrollTop - $('#stream').clientHeight < 120;
  const key = events.length + '|' + (d.draft ? d.draft.length : 0);

  if (key !== lastKey) {
    lastKey = key;
    let html = renderEvents(events);
    if (d.draft) {
      html += '<div class="m as live"><div class="who">小满 · 正在说</div><div class="txt">' + esc(d.draft)
        + '<span class="caret"></span></div></div>';
    }
    $('#inner').innerHTML = html;
    renderMemory(d.memory || []);
    if (atBottom) $('#stream').scrollTop = $('#stream').scrollHeight;
  }
}

async function send() {
  const text = $('#text').value.trim();
  const channel = $('#ch').value;
  const externalId = $('#uid').value.trim() || '10001';
  if (!text || inflight) return;
  inflight = true;
  $('#text').value = '';
  $('#text').style.height = 'auto';
  localStorage.setItem('fa_ch', channel);
  localStorage.setItem('fa_uid', externalId);
  await api('/api/chat/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ channel, externalId, text }),
  });
  await new Promise((r) => setTimeout(r, 250));
  inflight = false;
  lastKey = '';
  tick();
}

$('#send').addEventListener('click', send);
$('#text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#text').addEventListener('input', () => {
  const el = $('#text');
  el.style.height = 'auto';
  el.style.height = Math.min(180, el.scrollHeight) + 'px';
});
$('#apply').addEventListener('click', () => {
  localStorage.setItem('fa_ch', $('#ch').value);
  localStorage.setItem('fa_uid', $('#uid').value.trim());
  lastKey = '';
  tick();
});
$('#gate-btn').addEventListener('click', () => {
  localStorage.setItem('fa_token', $('#gate-input').value.trim());
  $('#gate').style.display = 'none';
  lastKey = ''; tick();
});

setInterval(tick, 1500);
tick();
</script>
</body>
</html>
